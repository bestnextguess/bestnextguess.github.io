# Run once by hand (Actions tab > "Download answer history" > Run workflow).
# Downloads every past Wordle answer into history.txt, slowly (about 30 minutes),
# then builds the "Has it been a Wordle answer?" page (answers.html).
# Safe to run again later: it only fills in missing days.
name: Download answer history
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Download every past answer
        run: python3 _backfill_history.py
      - name: Build the past-answers page
        run: python3 _build_answers.py
      - name: Save
        run: |
          git config user.name "Best Next Guess"
          git config user.email "bestnextguess@users.noreply.github.com"
          git add history.txt
          [ -f answers.html ] && git add answers.html
          git commit -m "Add answer history and past-answers page" || echo "Nothing new to save"
          git pull --rebase
          git push
