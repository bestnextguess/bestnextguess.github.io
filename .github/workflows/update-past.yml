# Once a day (12:30 UTC = 5:30 AM Pacific): adds yesterday's answer to past.txt,
# and records "puzzle-number word" in log.txt so the stats page stays current.
# Then rebuilds answers.html ("Has it been a Wordle answer?") once history.txt exists.
name: Update past answers
on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add yesterday's answer
        run: |
          DAY=$(date -u -d 'yesterday' +%F)
          NUM=$(( ( $(date -u -d "$DAY" +%s) - $(date -u -d 2021-06-19 +%s) ) / 86400 ))
          WORD=$(curl -fsS "https://www.nytimes.com/svc/wordle/v2/${DAY}.json" | python3 -c "import sys,json; print(json.load(sys.stdin)['solution'].lower())")
          if [[ "$WORD" =~ ^[a-z]{5}$ ]]; then
            CHANGED=0
            if ! grep -qx "$WORD" past.txt; then echo "$WORD" >> past.txt; CHANGED=1; fi
            touch log.txt
            if ! grep -q "^$NUM " log.txt; then echo "$NUM $WORD" >> log.txt; CHANGED=1; fi
            if [ "$CHANGED" = 1 ]; then
              git config user.name "Best Next Guess"
              git config user.email "bestnextguess@users.noreply.github.com"
              git add past.txt log.txt && git commit -m "Add answer for ${DAY} (#${NUM})" && git push
            fi
          fi
      - name: Rebuild the past-answers page
        run: |
          python3 _build_answers.py
          if [ -f answers.html ]; then
            git add answers.html
            if ! git diff --cached --quiet; then
              git config user.name "Best Next Guess"
              git config user.email "bestnextguess@users.noreply.github.com"
              git commit -m "Update past-answers page" && git pull --rebase && git push
            fi
          fi
