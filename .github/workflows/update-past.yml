# Adds yesterday's answer to past.txt once a day (12:30 UTC = 5:30 AM Pacific).
name: Update past answers
on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add yesterday's answer
        run: |
          DAY=$(date -u -d 'yesterday' +%F)
          WORD=$(curl -fsS "https://www.nytimes.com/svc/wordle/v2/${DAY}.json" | python3 -c "import sys,json; print(json.load(sys.stdin)['solution'].lower())")
          if [[ "$WORD" =~ ^[a-z]{5}$ ]] && ! grep -qx "$WORD" past.txt; then
            echo "$WORD" >> past.txt
            git config user.name "Best Next Guess"
            git config user.email "bestnextguess@users.noreply.github.com"
            git add past.txt && git commit -m "Add answer for ${DAY}" && git push
          fi
